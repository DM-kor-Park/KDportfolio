<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880" style="background:#FFFFFF;">
  <defs>
    <!-- 800x800 포세린 타일 그리드 (약 32px) -->
    <pattern id="tile-grid-800" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="none" stroke="#E5E7EB" stroke-width="0.5" />
    </pattern>
    <!-- 600x600 바닥 타일 그리드 (약 24px) -->
    <pattern id="tile-grid-600" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="#E5E7EB" stroke-width="0.5" />
    </pattern>
    <!-- 300x300 테라조 타일 그리드 (약 14px) -->
    <pattern id="tile-grid-300" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none" stroke="#E5E7EB" stroke-width="0.4" />
    </pattern>
    <!-- 원목 마루 / 헤링본 패턴 -->
    <pattern id="wood-herringbone" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0 L10 10 L0 20 M10 0 L20 10 L10 20" fill="none" stroke="#E5E7EB" stroke-width="0.5" />
    </pattern>
    <!-- 단면 콘크리트 해치 -->
    <pattern id="concrete-hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="8" y2="0" stroke="#9CA3AF" stroke-width="0.5" />
    </pattern>
  </defs>
  
  <style>
    /* CAD 오토캐드 표준 폰트 (영문/숫자: ROMANS, 한글: 모던 고딕) */
    .cad-kr { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 11px; fill: #000000; }
    .cad-kr-bold { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: bold; fill: #000000; }
    .cad-kr-sm { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 9.5px; fill: #000000; }
    
    /* 텍스트 뒤 선 겹침 방지 (White Halo Masking) */
    .cad-romans { 
      font-family: 'Romans', 'JetBrains Mono', 'Arial', monospace; 
      font-size: 11px; 
      font-weight: 600; 
      fill: #000000; 
      letter-spacing: 0.6px; 
      paint-order: stroke fill; 
      stroke: #FFFFFF; 
      stroke-width: 3.5px; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }
    .cad-romans-bold { 
      font-family: 'Romans', 'JetBrains Mono', 'Arial', monospace; 
      font-size: 12px; 
      font-weight: 700; 
      fill: #000000; 
      letter-spacing: 0.8px; 
      paint-order: stroke fill; 
      stroke: #FFFFFF; 
      stroke-width: 4px; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }
    .cad-romans-sm { 
      font-family: 'Romans', 'JetBrains Mono', 'Arial', monospace; 
      font-size: 9.5px; 
      font-weight: 600; 
      fill: #000000; 
      paint-order: stroke fill; 
      stroke: #FFFFFF; 
      stroke-width: 3px; 
    }
    
    /* 도면 타이틀 표준 */
    .cad-title-kr { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: bold; letter-spacing: 10px; fill: #000000; }
    .cad-title-scale { font-family: 'Romans', 'JetBrains Mono', 'Arial', monospace; font-size: 12px; font-weight: 700; fill: #000000; }
    .cad-tag-text { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 9.5px; fill: #000000; }
  </style>

    <g transform="translate(1200, 80)">
      <circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
      <polygon points="0,-15 -6,11 0,5" fill="#000000" />
      <polygon points="0,-15 6,11 0,5" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" />
      <text x="0" y="-19" class="cad-romans-bold" text-anchor="middle">N</text>
    </g>
    
    <g stroke="#000000" stroke-width="0.75" stroke-dasharray="18, 3, 2.5, 3">
      <line x1="120" y1="140" x2="1140" y2="140" />
      <line x1="120" y1="390" x2="1140" y2="390" />
      <line x1="120" y1="640" x2="1140" y2="640" />
      <line x1="200" y1="60" x2="200" y2="720" />
      <line x1="500" y1="60" x2="500" y2="720" />
      <line x1="800" y1="60" x2="800" y2="720" />
      <line x1="1060" y1="60" x2="1060" y2="720" />
    </g>
    
    <rect x="200" y="140" width="860" height="500" fill="url(#tile-grid-600)" stroke="none" />
    <rect x="740" y="140" width="320" height="280" fill="url(#wood-herringbone)" stroke="none" />
    
    <!-- 외벽체 (200T) -->
    <g fill="#C4C4C4" stroke="#000000" stroke-width="2.4">
      <rect x="190" y="130" width="880" height="20" />
      <rect x="190" y="130" width="20" height="520" />
      <rect x="1050" y="130" width="20" height="520" />
      <!-- 남측 테라스 분합창 제외 벽체 -->
      <rect x="190" y="630" width="240" height="20" />
      <rect x="750" y="630" width="320" height="20" />
    </g>

    <!-- 남측 전면 테라스 시스템 3중 시스템 창호 (X=430 to 750) -->
    <g stroke="#000000" stroke-width="1.4" fill="#FFFFFF">
      <rect x="430" y="635" width="320" height="12" />
      <line x1="430" y1="641" x2="750" y2="641" stroke-width="1.8" />
      <text x="590" y="627" class="cad-romans-sm" text-anchor="middle">TRIPLE GLAZED SYSTEM WINDOW (L=4,800)</text>
    </g>

    <!-- 내부 칸막이벽 (100T 마스터존 / 현관 / 주방 펜트리 구획) -->
    <g fill="#D1D5DB" stroke="#000000" stroke-width="1.8">
      <!-- 마스터 침실 서측 경계벽 -->
      <rect x="735" y="140" width="10" height="280" />
      <!-- 드레스룸 분할벽 -->
      <rect x="735" y="420" width="325" height="10" />
      <rect x="880" y="420" width="10" height="220" />
      <!-- 현관 중문 가벽 -->
      <rect x="200" y="270" width="150" height="10" />
    </g>
    
    <!-- [A] 현관 (ENTRANCE) -->
    <g stroke="#000000" stroke-width="1.0" fill="#FFFFFF">
      <!-- 3연동 슬라이딩 중문 -->
      <rect x="280" y="272" width="60" height="6" fill="#000000" />
      <text x="250" y="210" class="cad-kr-bold" text-anchor="middle">현관 (ENTRANCE)</text>
      <!-- 플로팅 신발장 및 하부조명 -->
      <rect x="210" y="150" width="28" height="110" fill="#F3F4F6" stroke-width="1.2" />
      <text x="224" y="210" class="cad-kr-sm" text-anchor="middle" transform="rotate(-90 224 210)">신발장 &amp; 전신경</text>
    </g>

    <!-- [B] 아일랜드 주방 (ISLAND KITCHEN) -->
    <g stroke="#000000" stroke-width="1.3" fill="#FFFFFF">
      <!-- 대형 트래버틴 아일랜드 (3,600 x 1,100) -->
      <rect x="420" y="170" width="220" height="65" rx="3" fill="#E5E7EB" />
      <!-- 인덕션 쿡탑 3구 -->
      <rect x="440" y="185" width="45" height="35" fill="#000000" />
      <circle cx="452" cy="202" r="7" stroke="#FFFFFF" fill="none" stroke-width="1" />
      <circle cx="472" cy="195" r="5" stroke="#FFFFFF" fill="none" stroke-width="1" />
      <circle cx="472" cy="210" r="5" stroke="#FFFFFF" fill="none" stroke-width="1" />
      <!-- 언더마운트 싱크볼 및 수전 -->
      <rect x="520" y="182" width="55" height="40" rx="3" fill="#F3F4F6" stroke-width="1.2" />
      <circle cx="585" cy="202" r="4" fill="#000000" />
      <!-- 바 스툴 의자 3개 -->
      <circle cx="460" cy="255" r="11" fill="none" stroke-width="1.2" />
      <circle cx="510" cy="255" r="11" fill="none" stroke-width="1.2" />
      <circle cx="560" cy="255" r="11" fill="none" stroke-width="1.2" />
      <text x="530" y="160" class="cad-kr-bold" text-anchor="middle">천연석 아일랜드 주방 (3,600x1,100)</text>

      <!-- 후면 키큰장 (빌트인 냉장고, 오븐) -->
      <rect x="360" y="150" width="340" height="15" fill="#C4C4C4" stroke-width="1.0" />
      <text x="530" y="142" class="cad-romans-sm" text-anchor="middle">BUILT-IN APPLIANCE CABINET</text>
    </g>

    <!-- [C] 다이닝 &amp; 거실 (LIVING &amp; DINING) -->
    <g stroke="#000000" stroke-width="1.2" fill="#FFFFFF">
      <!-- 8인용 원목 다이닝 테이블 -->
      <rect x="440" y="295" width="180" height="55" rx="3" />
      <text x="530" y="327" class="cad-kr" text-anchor="middle">다이닝 테이블 (8인석)</text>
      <!-- 의자들 -->
      <rect x="460" y="280" width="25" height="12" />
      <rect x="515" y="280" width="25" height="12" />
      <rect x="570" y="280" width="25" height="12" />
      <rect x="460" y="353" width="25" height="12" />
      <rect x="515" y="353" width="25" height="12" />
      <rect x="570" y="353" width="25" height="12" />

      <!-- 거실 대형 L자형 모듈러 소파 -->
      <path d="M 380,440 L 580,440 L 580,500 L 500,500 L 500,560 L 380,560 Z" fill="#F9FAFB" stroke-width="1.5" />
      <!-- 대리석 티테이블 -->
      <rect x="450" y="470" width="70" height="40" rx="3" fill="#E5E7EB" stroke-width="1.0" />
      <!-- 아트월 &amp; 벽난로 콘솔 -->
      <rect x="230" y="460" width="16" height="140" fill="#E5E7EB" stroke-width="1.2" />
      <text x="220" y="530" class="cad-kr-bold" text-anchor="middle" transform="rotate(-90 220 530)">천연 대리석 아트월 &amp; 에탄올 벽난로</text>
    </g>

    <!-- [D] 마스터 베드룸 &amp; 드레스룸 &amp; 마스터 욕실 -->
    <g stroke="#000000" stroke-width="1.2" fill="#FFFFFF">
      <!-- 킹사이즈 침대 (헤드보드 일체형) -->
      <rect x="800" y="170" width="160" height="130" rx="4" />
      <!-- 베개 2개 -->
      <rect x="815" y="180" width="55" height="35" rx="3" fill="#F3F4F6" />
      <rect x="890" y="180" width="55" height="35" rx="3" fill="#F3F4F6" />
      <!-- 협탁 2개 -->
      <rect x="760" y="170" width="35" height="35" />
      <rect x="965" y="170" width="35" height="35" />
      <text x="880" y="270" class="cad-kr-bold" text-anchor="middle">마스터베드룸 (KING BED)</text>

      <!-- 드레스룸 아일랜드 서랍장 &amp; 시스템장 -->
      <rect x="760" y="460" width="100" height="40" rx="2" fill="#F3F4F6" />
      <text x="810" y="484" class="cad-kr-sm" text-anchor="middle">액세서리 아일랜드</text>
      <!-- 시스템 옷장 라인 -->
      <rect x="745" y="435" width="125" height="20" stroke-dasharray="2, 2" />
      <rect x="745" y="590" width="125" height="20" stroke-dasharray="2, 2" />

      <!-- 마스터 욕실 (자립형 욕조 + 트윈 세면대 + 샤워부스) -->
      <!-- 자립형 욕조 -->
      <ellipse cx="980" cy="480" rx="45" ry="24" fill="#FFFFFF" stroke-width="1.6" />
      <ellipse cx="980" cy="480" rx="38" ry="18" fill="none" stroke-width="0.8" />
      <text x="980" y="484" class="cad-kr-sm" text-anchor="middle">자립형 욕조</text>
      <!-- 트윈 카운터 세면대 -->
      <rect x="910" y="550" width="130" height="35" rx="2" fill="#E5E7EB" stroke-width="1.3" />
      <ellipse cx="945" cy="567" rx="16" ry="11" fill="#FFFFFF" />
      <ellipse cx="1005" cy="567" rx="16" ry="11" fill="#FFFFFF" />
      <text x="975" y="605" class="cad-kr-sm" text-anchor="middle">건식 트윈 세면대</text>
    </g>
    
    <g transform="translate(480, 480)">
      <rect x="-80.0" y="-26" width="160" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="0.9" />
      <line x1="-80.0" y1="-9" x2="80.0" y2="-9" stroke="#000000" stroke-width="0.6" />
      <line x1="-80.0" y1="8" x2="80.0" y2="8" stroke="#000000" stroke-width="0.6" />
      <text x="0" y="-13" class="cad-kr-bold" text-anchor="middle">LIVING &amp; DINING</text>
      <text x="0" y="3" class="cad-tag-text" text-anchor="middle">app. 복합천연대리석 타일</text>
      <text x="0" y="20" class="cad-romans-sm" text-anchor="middle">92.4㎡ / 28.0py</text>
    </g>
    
    <g transform="translate(880, 320)">
      <rect x="-75.0" y="-26" width="150" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="0.9" />
      <line x1="-75.0" y1="-9" x2="75.0" y2="-9" stroke="#000000" stroke-width="0.6" />
      <line x1="-75.0" y1="8" x2="75.0" y2="8" stroke="#000000" stroke-width="0.6" />
      <text x="0" y="-13" class="cad-kr-bold" text-anchor="middle">MASTER BEDROOM</text>
      <text x="0" y="3" class="cad-tag-text" text-anchor="middle">app. 수입 원목마루</text>
      <text x="0" y="20" class="cad-romans-sm" text-anchor="middle">34.5㎡ / 10.4py</text>
    </g>
    
    <g transform="translate(975, 435)">
      <rect x="-70.0" y="-26" width="140" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="0.9" />
      <line x1="-70.0" y1="-9" x2="70.0" y2="-9" stroke="#000000" stroke-width="0.6" />
      <line x1="-70.0" y1="8" x2="70.0" y2="8" stroke="#000000" stroke-width="0.6" />
      <text x="0" y="-13" class="cad-kr-bold" text-anchor="middle">MASTER BATH</text>
      <text x="0" y="3" class="cad-tag-text" text-anchor="middle">app. 포세린 타일</text>
      <text x="0" y="20" class="cad-romans-sm" text-anchor="middle">16.8㎡ / 5.1py</text>
    </g>
    
      <line x1="200" y1="140" x2="200" y2="75" stroke="#000000" stroke-width="0.6" />
      <line x1="1060" y1="140" x2="1060" y2="75" stroke="#000000" stroke-width="0.6" />
      <line x1="200" y1="75" x2="1060" y2="75" stroke="#000000" stroke-width="0.8" />
      <circle cx="200" cy="75" r="2.2" fill="#000000" />
      <circle cx="1060" cy="75" r="2.2" fill="#000000" />
      <text x="630.0" y="71" class="cad-romans" text-anchor="middle">20,000</text>
    
      <line x1="200" y1="140" x2="120" y2="140" stroke="#000000" stroke-width="0.6" />
      <line x1="200" y1="640" x2="120" y2="640" stroke="#000000" stroke-width="0.6" />
      <line x1="120" y1="140" x2="120" y2="640" stroke="#000000" stroke-width="0.8" />
      <circle cx="120" cy="140" r="2.2" fill="#000000" />
      <circle cx="120" cy="640" r="2.2" fill="#000000" />
      <text x="115" y="390.0" class="cad-romans" text-anchor="middle" transform="rotate(-90 115 390.0)">12,000</text>
    
    <!-- 전통 제도 도면 타이틀 기호 ⦶ -->
    <g transform="translate(650, 830)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#000000" stroke-width="1.2" />
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#000000" stroke-width="1.0" />
      <text x="0" y="-8" class="cad-title-kr" text-anchor="middle">평    면    도</text>
    </g>
    </svg>