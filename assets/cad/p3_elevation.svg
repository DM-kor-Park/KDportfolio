<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880" style="background:#FFFFFF;">
  <defs>
    <!-- 800x800 포세린 타일 그리드 (약 32px) -->
    <pattern id="tile-grid-800" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="none" stroke="#E5E7EB" stroke-width="0.5" />
    </pattern>
    <!-- 600x600 바닥 타일 그리드 (약 24px) -->
    <pattern id="tile-grid-600" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="#E5E7EB" stroke-width="0.5" />
    </pattern>
    <!-- 300x300 테라조 타일 그리드 (약 14px) -->
    <pattern id="tile-grid-300" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none" stroke="#E5E7EB" stroke-width="0.4" />
    </pattern>
    <!-- 원목 마루 / 헤링본 패턴 -->
    <pattern id="wood-herringbone" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0 L10 10 L0 20 M10 0 L20 10 L10 20" fill="none" stroke="#E5E7EB" stroke-width="0.5" />
    </pattern>
    <!-- 단면 콘크리트 해치 -->
    <pattern id="concrete-hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="8" y2="0" stroke="#9CA3AF" stroke-width="0.5" />
    </pattern>
  </defs>
  
  <style>
    /* CAD 오토캐드 표준 폰트 (영문/숫자: ROMANS, 한글: 모던 고딕) */
    .cad-kr { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 11px; fill: #000000; }
    .cad-kr-bold { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: bold; fill: #000000; }
    .cad-kr-sm { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 9.5px; fill: #000000; }
    
    /* 텍스트 뒤 선 겹침 방지 (White Halo Masking) */
    .cad-romans { 
      font-family: 'Romans', 'JetBrains Mono', 'Arial', monospace; 
      font-size: 11px; 
      font-weight: 600; 
      fill: #000000; 
      letter-spacing: 0.6px; 
      paint-order: stroke fill; 
      stroke: #FFFFFF; 
      stroke-width: 3.5px; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }
    .cad-romans-bold { 
      font-family: 'Romans', 'JetBrains Mono', 'Arial', monospace; 
      font-size: 12px; 
      font-weight: 700; 
      fill: #000000; 
      letter-spacing: 0.8px; 
      paint-order: stroke fill; 
      stroke: #FFFFFF; 
      stroke-width: 4px; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }
    .cad-romans-sm { 
      font-family: 'Romans', 'JetBrains Mono', 'Arial', monospace; 
      font-size: 9.5px; 
      font-weight: 600; 
      fill: #000000; 
      paint-order: stroke fill; 
      stroke: #FFFFFF; 
      stroke-width: 3px; 
    }
    
    /* 도면 타이틀 표준 */
    .cad-title-kr { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: bold; letter-spacing: 10px; fill: #000000; }
    .cad-title-scale { font-family: 'Romans', 'JetBrains Mono', 'Arial', monospace; font-size: 12px; font-weight: 700; fill: #000000; }
    .cad-tag-text { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 9.5px; fill: #000000; }
  </style>

    <!-- 성수 팝업 입면도 2단 -->
    <g transform="translate(0, 40)">
      <line x1="160" y1="80" x2="1140" y2="80" stroke="#000000" stroke-width="0.8" stroke-dasharray="16, 4, 3, 4" />
      <text x="140" y="84" class="cad-romans-bold" text-anchor="end">CL +4,200</text>
      <line x1="160" y1="340" x2="1140" y2="340" stroke="#000000" stroke-width="1.8" />
      <text x="140" y="344" class="cad-romans-bold" text-anchor="end">FL ±0</text>

      <rect x="200" y="80" width="860" height="260" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
      <!-- 인터랙티브 미디어월 대형 스크린 입면 -->
      <rect x="260" y="100" width="480" height="180" fill="#111827" stroke="#000000" stroke-width="1.8" />
      <text x="500" y="195" class="cad-romans-bold" fill="#FFFFFF" font-size="16" letter-spacing="4" text-anchor="middle">SEONGSU POPUP MEDIA WALL</text>

      <!-- 계단형 스탠드 좌석 입면 -->
      <polygon points="760,340 760,250 820,250 820,280 880,280 880,310 940,310 940,340" fill="#E5E7EB" stroke="#000000" stroke-width="1.4" />
      <text x="850" y="270" class="cad-kr-bold" text-anchor="middle">우드 관람 스탠드</text>

      <g transform="translate(650, 380)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#000000" stroke-width="1.2" />
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#000000" stroke-width="0.8" />
        <text x="0" y="-6" class="cad-title-kr" font-size="16" letter-spacing="8" text-anchor="middle">B  입  면  도 (미디어월)</text>
      </g>
    </g>

    <g transform="translate(0, 460)">
      <line x1="160" y1="80" x2="1140" y2="80" stroke="#000000" stroke-width="0.8" stroke-dasharray="16, 4, 3, 4" />
      <text x="140" y="84" class="cad-romans-bold" text-anchor="end">CL +4,200</text>
      <line x1="160" y1="340" x2="1140" y2="340" stroke="#000000" stroke-width="1.8" />
      <text x="140" y="344" class="cad-romans-bold" text-anchor="end">FL ±0</text>

      <rect x="200" y="80" width="860" height="260" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
      <!-- 타공 페그보드 월 &amp; 스테인리스 바 카운터 -->
      <rect x="240" y="100" width="400" height="240" fill="#F3F4F6" stroke="#000000" stroke-width="1.4" />
      <text x="440" y="150" class="cad-kr-bold" text-anchor="middle">타공 철판 페그보드 굿즈 디스플레이 월</text>

      <rect x="680" y="240" width="320" height="100" fill="#E5E7EB" stroke="#000000" stroke-width="1.8" />
      <text x="840" y="295" class="cad-kr-bold" text-anchor="middle">헤어라인 스테인리스 F&amp;B 바 카운터 (H:1,000)</text>

      <g transform="translate(650, 380)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#000000" stroke-width="1.2" />
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#000000" stroke-width="0.8" />
        <text x="0" y="-6" class="cad-title-kr" font-size="16" letter-spacing="8" text-anchor="middle">A  입  면  도 (바 카운터)</text>
      </g>
    </g>
    </svg>